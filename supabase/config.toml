# Local Supabase configuration for the standalone Chestny Prigon project.
# Remote project identifiers and secrets must never be committed here.
project_id = "chestny-prigon"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000"]
enable_signup = false
enable_anonymous_sign_ins = false

[storage]
enabled = true
file_size_limit = "20MiB"
